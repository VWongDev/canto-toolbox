name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same gates CI runs, stated here rather than left to the husky
      # pre-commit hook the version-bump commit happens to fire: a release
      # should fail before it builds 76 MB and pushes a tag, not after.
      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Coverage (non-blocking)
        continue-on-error: true
        run: pnpm test:coverage

      - name: Bump version in package.json
        run: npm version ${{ inputs.bump }} --no-git-tag-version
        env:
          npm_config_allow_same_version: false

      - name: Sync version to manifest.json
        run: |
          NEW_VERSION=$(node -p "require('./package.json').version")
          node -e "
            const fs = require('fs');
            const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
            m.version = require('./package.json').version;
            fs.writeFileSync('manifest.json', JSON.stringify(m, null, 2) + '\n');
          "
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      # Same digest-keyed cache as CI: a release must not fail because Hugging
      # Face rate-limited the runner's shared address.
      - name: Restore OCR models
        uses: actions/cache@v6
        with:
          path: public/ocr/models
          key: ocr-models-${{ hashFiles('build-tools/fetch-ocr-assets.ts') }}

      - name: Build extension
        run: NODE_OPTIONS=--max-old-space-size=8192 pnpm build

      - name: Benchmark lookup performance
        run: pnpm bench

      - name: Install xvfb and Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-noto-cjk libgbm1 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libasound2t64

      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run e2e tests
        run: xvfb-run --auto-servernum pnpm test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Install Puppeteer Chrome
        run: npx puppeteer browsers install chrome

      - name: Generate screenshots
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" pnpm screenshots

      - name: Create release zip
        run: zip -r canto-toolbox-${{ env.NEW_VERSION }}.zip dist/

      - name: Commit version bump and screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json screenshots/
          git commit -m "chore(global): Bump version to ${{ env.NEW_VERSION }}"

      - name: Push version bump and create tag
        run: |
          git tag "v${{ env.NEW_VERSION }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ env.NEW_VERSION }}"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ env.NEW_VERSION }}" \
            --title "v${{ env.NEW_VERSION }}" \
            --generate-notes \
            "canto-toolbox-${{ env.NEW_VERSION }}.zip"
